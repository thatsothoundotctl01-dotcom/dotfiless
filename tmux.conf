set -g default-shell /usr/bin/zsh 

# shell and basics
set -g default-shell /usr/bin/zsh
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",alacritty:RGB"
set -g mouse on
set -g escape-time 0
set -g base-index 1

# status bar on top, windows centered
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default,fg=#d0d0d0"

# left: [main]   right: "pane title" time date
set -g status-left "[#S] "
set -g status-left-length 30
set -g status-right '"#{=21:pane_title}" %H:%M %d-%b-%y'
set -g status-right-length 60

# windows: 1:zsh 2:zsh, active one in yellow-green
setw -g window-status-format "#I:#W"
setw -g window-status-current-format "#I:#W"
setw -g window-status-current-style "fg=#b8cc52,bold"

# pane borders: thin gray, active one blue
set -g pane-border-lines simple
set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#2aa3e0"
